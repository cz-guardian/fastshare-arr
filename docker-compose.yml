services:
  fastshare-arr:
    build: .
    container_name: fastshare-arr
    user: "1000:1000"            # same uid/gid as your *arr containers
    restart: unless-stopped
    ports: ["8085:8085"]
    environment:
      FASTSHARE_USER: "your-login"
      FASTSHARE_PASS: "your-password"
      # FASTSHARE_API_BASE: https://fastshare.cz   # Kodi add-on default; try https://fastshare.cloud if needed
      INCOMPLETE_DIR: /data/downloads/fastshare/incomplete
      COMPLETE_DIR: /data/downloads/fastshare/complete
      CATEGORIES: tv,movies,music
      # MAX_ACTIVE_JOBS: 1  SPEED_LIMIT_KBPS: 0  EXTRACT: "true"  DEBUG: "false"
    volumes:
      - ./config:/config
      - /path/to/data:/data      # MUST be the same host path/mount your *arr containers use as /data
